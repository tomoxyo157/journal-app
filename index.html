<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>journal</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="216.png">

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22daily%20journal%22%2C%22short_name%22%3A%22journal%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f1ea%22%2C%22theme_color%22%3A%22%23f4f1ea%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22215.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="theme-color" content="#f4f1ea" id="theme-color-meta">

    <!-- EB Garamond Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Force Lowercase Everywhere */
        * {
            box-sizing: border-box;
            font-family: 'EB Garamond', serif !important;
            text-transform: lowercase !important;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        ::placeholder {
            text-transform: lowercase !important;
            opacity: 0.75;
            text-align: center;
        }

        :root {
            --bg-color: #f4f1ea;
            --card-bg: #fbfbf9;
            --border-color: #e3ded4;
            --text-color: #232220;
            --muted-color: #8c867b;
            --accent-color: #4a453e;
            --dim-opacity: 0.15;
            --shadow-float: 0 12px 40px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --bg-color: #141413;
            --card-bg: #1c1c1a;
            --border-color: #2a2a27;
            --text-color: #e3ded8;
            --muted-color: #737068;
            --accent-color: #b5b0a4;
            --dim-opacity: 0.12;
            --shadow-float: 0 12px 40px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* Grainy Abstract Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 16px;
            position: relative;
        }

        .app-container {
            max-width: 440px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 700px;
        }

        /* Top-Right Minimalist Logout (Close Symbol) */
        .btn-top-logout {
            position: fixed;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            opacity: 0.35;
            z-index: 10000;
            transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .btn-top-logout:hover {
            opacity: 1;
            color: #ff3b30;
            transform: scale(1.1);
        }

        /* Top Controls Wrapper */
        .top-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: calc(50% - 130px);
            left: 50%;
            transform: translateX(-50%);
            padding: 0 4px;
            z-index: 10;
        }

        .top-left-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Slider Switcher for Day/Night */
        .theme-switch {
            position: relative;
            width: 25px;
            height: 13px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .theme-switch-handle {
            width: 9px;
            height: 9px;
            background: var(--text-color);
            border-radius: 50%;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .theme-switch-handle {
            transform: translateX(12px);
        }

        .theme-switch-handle svg {
            width: 5px;
            height: 5px;
            fill: var(--bg-color);
        }

        /* Weekly Audit Button style */
        .weekly-audit-dot {
            background: var(--muted-color);
            opacity: 0.4;
            border: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            cursor: pointer;
        }

        .weekly-audit-dot:hover {
            opacity: 0.8;
            transform: scale(1.2);
        }

        /* Main Floating Writing Card */
        .editor-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow-float);
            width: 100%;
            max-width: 420px;
            height: 210px;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 2;
        }

        .journal-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.4;
            text-align: center;
            overflow-y: auto;
            padding-bottom: 26px;
        }

        .editor-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 45px;
            background: linear-gradient(to top, var(--card-bg), transparent);
            pointer-events: none;
        }

        .floating-footer-left {
            position: absolute;
            bottom: 12px;
            left: 18px;
            font-size: 0.7rem;
            color: var(--muted-color);
            z-index: 2;
        }

        .floating-footer-right {
            position: absolute;
            bottom: 10px;
            right: 14px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-circle-submit {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-circle-submit:hover {
            opacity: 0.85;
            transform: scale(1.15);
        }

        /* Clear Button styled exactly like logout/close symbol */
        .btn-clear-inline {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            opacity: 0.35;
            transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .btn-clear-inline:hover {
            opacity: 1;
            color: #ff3b30;
            transform: scale(1.1);
        }

        /* Mini Calendar Widget */
        .calendar-card {
            background: transparent;
            border: none;
            padding: 2px;
            width: 100%;
            max-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: absolute;
            top: calc(50% + 210px); 
            left: 50%;
            transform: translateX(-50%);
            zoom: 0.8;
            opacity: 0.55;
            z-index: 2;
        }

        .calendar-card:hover {
            opacity: 0.95;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 0 2px;
        }

        .month-display {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted-color);
        }

        .calendar-nav-group {
            display: flex;
            gap: 2px;
        }

        .cal-icon-btn {
            background: none;
            border: none;
            color: var(--muted-color);
            cursor: pointer;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        .cal-icon-btn:hover {
            color: var(--text-color);
            background: var(--border-color);
        }

        .cal-icon-btn svg {
            width: 9px;
            height: 9px;
            fill: currentColor;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.65rem;
            color: var(--muted-color);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            justify-items: center;
        }

        .day-cell {
            width: 18px;
            height: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            background: transparent;
            color: var(--text-color);
            border-radius: 2px;
            position: relative;
        }

        .day-cell:hover {
            background: var(--border-color);
        }

        .day-cell.empty {
            cursor: default;
        }

        @keyframes blink-dot {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .day-indicator {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-color);
            position: absolute;
            bottom: 1px;
            opacity: 0;
        }

        .day-cell.today-cell .day-indicator {
            animation: blink-dot 1.5s infinite ease-in-out;
            opacity: 1;
        }

        .day-cell.has-entry .day-indicator {
            opacity: 1 !important;
            animation: none !important;
        }

        .dimmed {
            opacity: var(--dim-opacity) !important;
            pointer-events: none;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 40vw;
            max-width: 260px;
            min-width: 220px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            padding: 14px;
            box-shadow: var(--shadow-md);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--muted-color);
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .entry-content-italic {
            font-style: italic;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
            color: var(--text-color);
        }

        .meta-info {
            font-size: 0.65rem;
            color: var(--muted-color);
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        .weekly-select-wrapper {
            margin-bottom: 8px;
            width: 100%;
        }

        .weekly-dropdown {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .weekly-entry-item {
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .weekly-entry-item:last-child {
            border-bottom: none;
        }

        .weekly-date {
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 2px;
            color: var(--accent-color);
        }

        .weekly-text {
            font-size: 0.8rem;
            line-height: 1.35;
            white-space: pre-wrap;
        }

        .btn-action-sm {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.65rem;
        }

        /* Form Input khusus Modal Login */
        .auth-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--text-color);
            color: var(--bg-color);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.2s ease;
            z-index: 20000;
        }

        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                height: 100dvh;
                overflow: hidden !important;
            }

            .app-container {
                max-width: 100%;
                height: 100dvh;
                min-height: unset;
            }

            .top-controls {
                max-width: 75%;
                top: calc(50% - 155px);
            }

            .editor-card {
                max-width: 75% !important;
                height: 250px !important;
            }

            .calendar-card {
                top: calc(50% + 31vh) !important;
            }

            .btn-top-logout {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Tombol Close Super Minimalis di Pojok Kanan Atas sebagai Logout / Auth Action -->
    <button class="btn-top-logout" onclick="handleAuthAction()" id="authButtonIcon" title="logout / login">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- Top Controls -->
    <div class="top-controls" id="topControls">
        <div class="top-left-controls">
            <div class="theme-switch" onclick="toggleTheme()" title="toggle theme">
                <div class="theme-switch-handle" id="switchHandle">
                    <svg viewBox="0 0 24 24" id="switchIcon"></svg>
                </div>
            </div>
        </div>
        <button class="weekly-audit-dot" onclick="openWeeklyAudit()" title="weekly audit"></button>
    </div>

    <!-- Main Floating Writing Card -->
    <main class="editor-card" id="editorCard">
        <textarea 
            class="journal-textarea" 
            id="mainTextarea" 
            placeholder="what is on your mind today? write freely..."
            oninput="handleWritingInput()"
        ></textarea>

        <div class="floating-footer-left" id="counterDisplay">0 words · 0 chars</div>
        <div class="floating-footer-right">
            <!-- Clear Button (styled like logout/close symbol) -->
            <button class="btn-clear-inline" onclick="clearCurrentJournal()" title="clear text">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <button class="btn-circle-submit" onclick="saveCurrentJournal()" title="submit"></button>
        </div>
    </main>

    <!-- Mini Calendar Widget -->
    <div class="calendar-card" id="calendarCard">
        <div class="calendar-header">
            <div class="calendar-nav-group">
                <button class="cal-icon-btn" onclick="jumpToday()" title="today">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
            <span class="month-display" id="monthYearTitle"></span>
            <div class="calendar-nav-group">
                <button class="cal-icon-btn" onclick="prevMonth()" title="previous month">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <button class="cal-icon-btn" onclick="nextMonth()" title="next month">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>
        </div>

        <div class="weekdays-grid">
            <span>s</span><span>m</span><span>t</span><span>w</span><span>t</span><span>f</span><span>s</span>
        </div>
        <div class="days-grid" id="calendarDays"></div>
    </div>
</div>

<!-- Login Modal Window -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-card" style="max-width: 280px;">
        <div class="modal-header">
            <span class="modal-title">supabase login</span>
        </div>
        <div class="modal-body" style="gap: 10px; padding-top: 4px;">
            <input type="email" id="loginEmail" class="auth-input" placeholder="email address...">
            <input type="password" id="loginPassword" class="auth-input" placeholder="password...">
            <button class="btn-action-sm" style="width: 100%; padding: 7px; margin-top: 4px;" onclick="submitLogin()">sign in</button>
        </div>
    </div>
</div>

<!-- Date Entry Modal -->
<div class="modal-overlay" id="readModal" onclick="closeModalOnOverlay(event, 'readModal')">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title" id="readModalDate"></span>
            <button class="btn-close" onclick="closeModal('readModal')">×</button>
        </div>
        <div class="modal-body">
            <div class="entry-content-italic" id="readModalContent"></div>
            <div class="meta-info" id="readModalMeta"></div>
        </div>
        <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
            <button class="btn-action-sm" id="readModalEditBtn">edit entry</button>
        </div>
    </div>
</div>

<!-- Date Entry Edit Modal (Diadaptasi dari placeholder/editor utama) -->
<div class="modal-overlay" id="editModal" onclick="closeModalOnOverlay(event, 'editModal')">
    <div class="modal-card" style="max-width: 320px; width: 85vw; padding: 0; overflow: hidden; background: var(--card-bg);">
        <div class="modal-header" style="padding: 12px 16px; margin-bottom: 0; border-bottom: 1px solid var(--border-color);">
            <span class="modal-title" id="editModalDate">edit entry</span>
            <button class="btn-close" onclick="closeModal('editModal')">×</button>
        </div>
        <div class="modal-body" style="padding: 16px; position: relative; height: 180px; overflow: hidden; display: flex; flex-direction: column;">
            <textarea 
                class="journal-textarea" 
                id="editModalTextarea" 
                placeholder="what is on your mind for this date? write freely..."
                oninput="handleEditModalInput()"
                style="text-align: center; font-size: 1.05rem; height: 100%; padding-bottom: 30px;"
            ></textarea>
            
            <!-- Gradient Overlay Footer Effect -->
            <div style="content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 45px; background: linear-gradient(to top, var(--card-bg), transparent); pointer-events: none;"></div>

            <!-- Footer Left: Counter -->
            <div class="floating-footer-left" id="editCounterDisplay" style="bottom: 14px; left: 16px;">0 words · 0 chars</div>

            <!-- Footer Right: Clear & Submit Buttons -->
            <div class="floating-footer-right" style="bottom: 12px; right: 14px; gap: 8px;">
                <button class="btn-clear-inline" onclick="clearEditModalJournal()" title="clear text">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button class="btn-circle-submit" onclick="saveModalEdit()" title="submit"></button>
            </div>
        </div>
    </div>
</div>

<!-- Weekly Audit Modal -->
<div class="modal-overlay" id="weeklyModal" onclick="closeModalOnOverlay(event, 'weeklyModal')">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title">weekly audit</span>
            <button class="btn-close" onclick="closeModal('weeklyModal')">×</button>
        </div>
        <div class="weekly-select-wrapper">
            <select class="weekly-dropdown" id="weeklyWeekSelector" onchange="renderWeeklyAuditContent()"></select>
        </div>
        <div class="modal-body" id="weeklyModalBody"></div>
        <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
            <button class="btn-action-sm" onclick="copyWeeklyAudit()">copy summary</button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast-msg" id="toast">copied to clipboard!</div>

<script>
    // Inisialisasi Supabase menggunakan kredensial Anda
    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdmNqc2NkbnR3Y2thc2xudW1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNDU3ODUsImV4cCI6MjEwMDYyMTc4NX0.rGYGREApohqwSaArGr4DtZXeuUJ0OUE7QeOyNjpswv8';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDate = new Date();
    let selectedDateStr = getFormattedDateStr(new Date());
    let activeEditModalDate = null;
    let currentUser = null;
    let journalEntries = {};

    const sunIconSVG = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1z"/>`;
    const moonIconSVG = `<path d="M12.3 2c.43 0 .77.35.73.78-.34 4.24 2.12 8.16 6.02 9.69.39.15.58.58.42.97-1.8 4.36-6.12 7.16-10.87 7.05-5.69-.13-10.23-4.78-10.2-10.48.03-5.22 4.02-9.58 9.22-9.98.22-.02.46-.03.68-.03z"/>`;

    window.addEventListener('DOMContentLoaded', async () => {
        initTheme();
        initEditorFocusEvents();
        initKeyboardEscape();

        // Cek sesi login aktif di Supabase
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            openLoginModal();
        } else {
            currentUser = session.user;
            await fetchUserEntries();
        }
    });

    function openLoginModal() {
        const modal = document.getElementById('loginModal');
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeLoginModal() {
        const modal = document.getElementById('loginModal');
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 200);
    }

    async function submitLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showToast('fill email & password');
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            showToast(error.message);
        } else {
            currentUser = data.user;
            closeLoginModal();
            showToast('login success!');
            await fetchUserEntries();
        }
    }

    async function handleAuthAction() {
        if (currentUser) {
            await supabaseClient.auth.signOut();
            currentUser = null;
            journalEntries = {};
            renderCalendar();
            document.getElementById('mainTextarea').value = '';
            updateCounters('');
            openLoginModal();
        } else {
            openLoginModal();
        }
    }

    async function fetchUserEntries() {
        if (!currentUser) return;
        const { data, error } = await supabaseClient
            .from('journals')
            .select('*')
            .eq('user_id', currentUser.id);

        if (!error && data) {
            journalEntries = {};
            data.forEach(row => {
                journalEntries[row.entry_date] = {
                    content: row.content,
                    createdAt: row.created_at,
                    updatedAt: row.updated_at
                };
            });
            renderCalendar();
            loadTodayOrDraft();
        } else {
            console.error('error fetching entries:', error);
        }
    }

    function getFormattedDateStr(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('journal_theme') || 'day';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('switchIcon').innerHTML = moonIconSVG;
            document.getElementById('theme-color-meta').setAttribute('content', '#141413');
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('switchIcon').innerHTML = sunIconSVG;
            document.getElementById('theme-color-meta').setAttribute('content', '#f4f1ea');
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('journal_theme', isDark ? 'dark' : 'day');
        document.getElementById('switchIcon').innerHTML = isDark ? moonIconSVG : sunIconSVG;
        document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#141413' : '#f4f1ea');
    }

    function initKeyboardEscape() {
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal('readModal');
                closeModal('editModal');
                closeModal('weeklyModal');
            }
        });
    }

    function initEditorFocusEvents() {
        const textarea = document.getElementById('mainTextarea');
        const calendarCard = document.getElementById('calendarCard');
        const topControls = document.getElementById('topControls');

        textarea.addEventListener('focus', () => {
            calendarCard.classList.add('dimmed');
            topControls.classList.add('dimmed');
        });

        textarea.addEventListener('blur', () => {
            calendarCard.classList.remove('dimmed');
            topControls.classList.remove('dimmed');
        });
    }

    function loadTodayOrDraft() {
        const todayStr = getFormattedDateStr(new Date());
        selectedDateStr = todayStr;
        const textarea = document.getElementById('mainTextarea');

        if (journalEntries[todayStr]) {
            textarea.value = journalEntries[todayStr].content;
        } else {
            textarea.value = '';
        }

        updateCounters(textarea.value);
    }

    function handleWritingInput() {
        const textarea = document.getElementById('mainTextarea');
        const val = textarea.value.toLowerCase();
        textarea.value = val;
        updateCounters(val);
    }

    function updateCounters(text) {
        const chars = text.length;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        document.getElementById('counterDisplay').innerText = `${words} words · ${chars} chars`;
    }

    function clearCurrentJournal() {
        const textarea = document.getElementById('mainTextarea');
        textarea.value = '';
        updateCounters('');
        showToast('text cleared');
    }

    async function saveCurrentJournal() {
        if (!currentUser) {
            openLoginModal();
            return;
        }

        const todayStr = getFormattedDateStr(new Date());

        if (journalEntries[todayStr]) {
            showToast('already submitted today. use calendar to edit.');
            return;
        }

        const textarea = document.getElementById('mainTextarea');
        const content = textarea.value.trim().toLowerCase();

        if (!content) {
            showToast('entry is empty');
            return;
        }

        const { error } = await supabaseClient
            .from('journals')
            .upsert({
                user_id: currentUser.id,
                entry_date: todayStr,
                content: content,
                updated_at: new Date().toISOString()
            }, { onConflict: ['user_id', 'entry_date'] });

        if (error) {
            showToast('failed to save online');
            console.error(error);
        } else {
            await fetchUserEntries();
            textarea.value = '';
            updateCounters('');
            showToast('submitted & saved online!');
        }
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames3 = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
        const shortYear = String(year).slice(-2);
        document.getElementById('monthYearTitle').innerText = `${monthNames3[month]} '${shortYear}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        const daysContainer = document.getElementById('calendarDays');
        daysContainer.innerHTML = '';

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            daysContainer.appendChild(emptyCell);
        }

        const realTodayStr = getFormattedDateStr(new Date());

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            dayCell.innerText = day;

            const indicator = document.createElement('div');
            indicator.className = 'day-indicator';
            dayCell.appendChild(indicator);

            if (dateStr === realTodayStr) {
                dayCell.classList.add('today-cell');
            }

            if (journalEntries[dateStr]) {
                dayCell.classList.add('has-entry');
            }

            dayCell.onclick = () => handleDateClick(dateStr);
            daysContainer.appendChild(dayCell);
        }
    }

    function prevMonth() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    }

    function nextMonth() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    }

    function jumpToday() {
        currentDate = new Date();
        renderCalendar();
        loadTodayOrDraft();
    }

    function handleDateClick(dateStr) {
        const entry = journalEntries[dateStr];
        const dateObj = new Date(dateStr + 'T00:00:00');
        const formattedTitle = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toLowerCase();

        document.getElementById('readModalDate').innerText = formattedTitle;

        if (entry && entry.content) {
            document.getElementById('readModalContent').innerText = `"${entry.content}"`;
            
            const words = entry.content.trim().split(/\s+/).length;
            const chars = entry.content.length;
            const created = new Date(entry.createdAt).toLocaleString('en-US').toLowerCase();
            const modified = new Date(entry.updatedAt).toLocaleString('en-US').toLowerCase();

            document.getElementById('readModalMeta').innerHTML = `
                <span>words: ${words} · chars: ${chars}</span>
                <span>created: ${created}</span>
                <span>modified: ${modified}</span>
            `;
        } else {
            document.getElementById('readModalContent').innerText = "you haven't written anything for this date.";
            document.getElementById('readModalMeta').innerHTML = "<span>no metadata available</span>";
        }

        document.getElementById('readModalEditBtn').onclick = () => {
            closeModal('readModal');
            openEditModal(dateStr);
        };

        openModal('readModal');
    }

    function openEditModal(dateStr) {
        activeEditModalDate = dateStr;
        const dateObj = new Date(dateStr + 'T00:00:00');
        const formattedTitle = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }).toLowerCase();

        document.getElementById('editModalDate').innerText = `edit: ${formattedTitle}`;
        const textarea = document.getElementById('editModalTextarea');
        
        const existingContent = journalEntries[dateStr] ? journalEntries[dateStr].content : '';
        textarea.value = existingContent;
        updateEditCounters(existingContent);

        openModal('editModal');
    }

    function handleEditModalInput() {
        const textarea = document.getElementById('editModalTextarea');
        const val = textarea.value.toLowerCase();
        textarea.value = val;
        updateEditCounters(val);
    }

    function updateEditCounters(text) {
        const chars = text.length;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        document.getElementById('editCounterDisplay').innerText = `${words} words · ${chars} chars`;
    }

    function clearEditModalJournal() {
        const textarea = document.getElementById('editModalTextarea');
        textarea.value = '';
        updateEditCounters('');
        showToast('text cleared');
    }

    async function saveModalEdit() {
        if (!activeEditModalDate || !currentUser) return;

        const textarea = document.getElementById('editModalTextarea');
        const content = textarea.value.trim().toLowerCase();

        if (content) {
            const { error } = await supabaseClient
                .from('journals')
                .upsert({
                    user_id: currentUser.id,
                    entry_date: activeEditModalDate,
                    content: content,
                    updated_at: new Date().toISOString()
                }, { onConflict: ['user_id', 'entry_date'] });

            if (error) {
                showToast('failed to update entry');
                return;
            }
        } else {
            await supabaseClient
                .from('journals')
                .delete()
                .eq('user_id', currentUser.id)
                .eq('entry_date', activeEditModalDate);
        }

        await fetchUserEntries();
        
        if (activeEditModalDate === getFormattedDateStr(new Date())) {
            loadTodayOrDraft();
        }

        closeModal('editModal');
        showToast('entry updated online!');
    }

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        return { year: d.getUTCFullYear(), week: weekNo };
    }

    function getDateRangeOfWeek(weekNo, year) {
        const simple = new Date(year, 0, 1 + (weekNo - 1) * 7);
        const dow = simple.getDay();
        const ISOweekStart = new Date(simple);
        if (dow <= 4)
            ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
        else
            ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
        
        const weekDates = [];
        for (let i = 0; i < 7; i++) {
            const nextDay = new Date(ISOweekStart);
            nextDay.setDate(ISOweekStart.getDate() + i);
            weekDates.push(nextDay);
        }
        return weekDates;
    }

    function openWeeklyAudit() {
        const selector = document.getElementById('weeklyWeekSelector');
        selector.innerHTML = '';

        const today = new Date();
        const currentW = getWeekNumber(today);

        for (let w = currentW.week; w >= 1; w--) {
            const dates = getDateRangeOfWeek(w, currentW.year);
            const startStr = dates[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase();
            const endStr = dates[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase();
            
            const opt = document.createElement('option');
            opt.value = `${currentW.year}-W${w}`;
            opt.innerText = `week ${w} (${startStr} - ${endStr})`;
            selector.appendChild(opt);
        }

        selector.selectedIndex = 0;
        renderWeeklyAuditContent();
        openModal('weeklyModal');
    }

    function renderWeeklyAuditContent() {
        const selector = document.getElementById('weeklyWeekSelector');
        const val = selector.value;
        if (!val) return;

        const [yearStr, weekPart] = val.split('-W');
        const weekNum = parseInt(weekPart, 10);
        const yearNum = parseInt(yearStr, 10);

        const dates = getDateRangeOfWeek(weekNum, yearNum);
        const bodyEl = document.getElementById('weeklyModalBody');
        bodyEl.innerHTML = '';

        dates.forEach(d => {
            const dateStr = getFormattedDateStr(d);
            const formattedDate = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toLowerCase();

            const entry = journalEntries[dateStr];
            const itemEl = document.createElement('div');
            itemEl.className = 'weekly-entry-item';

            if (entry && entry.content) {
                itemEl.innerHTML = `
                    <div class="weekly-date">${formattedDate}</div>
                    <div class="weekly-text">${entry.content}</div>
                `;
            } else {
                itemEl.innerHTML = `
                    <div class="weekly-date">${formattedDate}</div>
                    <div class="weekly-text" style="color: var(--muted-color); font-style: italic;">no entry recorded.</div>
                `;
            }

            bodyEl.appendChild(itemEl);
        });
    }

    function copyWeeklyAudit() {
        const selector = document.getElementById('weeklyWeekSelector');
        const val = selector.value;
        if (!val) return;

        const [yearStr, weekPart] = val.split('-W');
        const weekNum = parseInt(weekPart, 10);
        const yearNum = parseInt(yearStr, 10);
        const dates = getDateRangeOfWeek(weekNum, weekNum ? weekNum : 1, yearNum);

        let summaryText = `weekly audit summary - week ${weekNum} (${yearNum})

`;

        dates.forEach(d => {
            const dateStr = getFormattedDateStr(d);
            const formattedDate = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toLowerCase();
            const entry = journalEntries[dateStr];

            summaryText += `--- ${formattedDate} ---
`;
            summaryText += entry ? `${entry.content}

` : `(no entry)

`;
        });

        navigator.clipboard.writeText(summaryText.trim()).then(() => {
            showToast('summary copied to clipboard!');
        });
    }

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 200);
    }

    function closeModalOnOverlay(event, id) {
        if (event.target.id === id) closeModal(id);
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg.toLowerCase();
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>
