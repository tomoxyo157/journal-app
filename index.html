<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>journal</title>
    
    <link rel="icon" type="image/png" href="216.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22daily%20journal%22%2C%22short_name%22%3A%22journal%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f1ea%22%2C%22theme_color%22%3A%22%23f4f1ea%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22215.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="theme-color" content="#f4f1ea" id="theme-color-meta">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'EB Garamond', serif !important;
            text-transform: lowercase !important;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
        }

        ::placeholder {
            opacity: 0.75;
            text-align: center;
        }

        :root {
            --bg-color: #f4f1ea;
            --card-bg: #fbfbf9;
            --border-color: #e3ded4;
            --text-color: #232220;
            --muted-color: #8c867b;
            --accent-color: #4a453e;
            --dim-opacity: 0.15;
            --shadow-float: 0 12px 40px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --bg-color: #141413;
            --card-bg: #1c1c1a;
            --border-color: #2a2a27;
            --text-color: #e3ded8;
            --muted-color: #737068;
            --accent-color: #b5b0a4;
            --dim-opacity: 0.12;
            --shadow-float: 0 12px 40px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 16px;
            position: relative;
        }

        /* Combined Scrollbar Hiding */
        body, .journal-textarea, .modal-body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar, .journal-textarea::-webkit-scrollbar, .modal-body::-webkit-scrollbar {
            display: none;
        }

        .app-container {
            max-width: 440px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 700px;
        }

        /* Combined Shared Styles for Minimal Icons */
        .btn-top-logout, .btn-clear-inline {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            opacity: 0.35;
            transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .btn-top-logout {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 6px;
            z-index: 10000;
        }
        .btn-clear-inline {
            padding: 2px;
        }
        .btn-top-logout:hover, .btn-clear-inline:hover {
            opacity: 1;
            color: #ff3b30;
            transform: scale(1.1);
        }

        .top-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: calc(50% - 130px);
            left: 50%;
            transform: translateX(-50%);
            padding: 0 4px;
            z-index: 10;
        }

        .top-left-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-switch {
            position: relative;
            width: 25px;
            height: 13px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .theme-switch-handle {
            width: 9px;
            height: 9px;
            background: var(--text-color);
            border-radius: 50%;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.dark-mode .theme-switch-handle {
            transform: translateX(12px);
        }

        .theme-switch-handle svg {
            width: 5px;
            height: 5px;
            fill: var(--bg-color);
        }

        .weekly-audit-dot {
            background: var(--muted-color);
            opacity: 0.4;
            border: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            cursor: pointer;
        }

        .weekly-audit-dot:hover {
            opacity: 0.8;
            transform: scale(1.2);
        }

        .editor-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow-float);
            width: 100%;
            max-width: 420px;
            height: 210px;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 2;
        }

        .journal-textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.4;
            text-align: center;
            padding-bottom: 48px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            cursor: text;
        }

        .journal-textarea:empty:before {
            content: attr(data-placeholder);
            color: var(--text-color);
            opacity: 0.75;
        }

        .journal-textarea s, .entry-content-italic s, .weekly-text s {
            text-decoration: line-through;
            opacity: 0.45;
        }

        .editor-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 45px;
            background: linear-gradient(to top, var(--card-bg), transparent);
            pointer-events: none;
        }

        .floating-footer-left {
            position: absolute;
            bottom: 12px;
            left: 18px;
            font-size: 0.7rem;
            color: var(--muted-color);
            z-index: 3;
        }

        .floating-footer-right {
            position: absolute;
            bottom: 10px;
            right: 14px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-circle-submit {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-circle-submit:hover {
            opacity: 0.85;
            transform: scale(1.15);
        }

        .calendar-card {
            background: transparent;
            border: none;
            padding: 2px;
            width: 100%;
            max-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: absolute;
            top: calc(50% + 210px); 
            left: 50%;
            transform: translateX(-50%);
            zoom: 0.8;
            opacity: 0.55;
            z-index: 2;
        }

        .calendar-card:hover {
            opacity: 0.95;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 0 2px;
        }

        .month-display {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted-color);
        }

        .calendar-nav-group {
            display: flex;
            gap: 2px;
        }

        .cal-icon-btn {
            background: none;
            border: none;
            color: var(--muted-color);
            cursor: pointer;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        .cal-icon-btn:hover {
            color: var(--text-color);
            background: var(--border-color);
        }

        .cal-icon-btn svg {
            width: 9px;
            height: 9px;
            fill: currentColor;
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.65rem;
            color: var(--muted-color);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            justify-items: center;
        }

        .day-cell {
            width: 18px;
            height: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            background: transparent;
            color: var(--text-color);
            border-radius: 2px;
            position: relative;
        }

        .day-cell:hover {
            background: var(--border-color);
        }

        .day-cell.empty {
            cursor: default;
        }

        @keyframes blink-dot {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .day-indicator {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-color);
            position: absolute;
            bottom: 1px;
            opacity: 0;
        }

        .day-cell.today-cell .day-indicator {
            animation: blink-dot 1.5s infinite ease-in-out;
            opacity: 1;
        }

        .day-cell.has-entry .day-indicator {
            opacity: 1 !important;
            animation: none !important;
        }

        .dimmed {
            opacity: var(--dim-opacity) !important;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 40vw;
            max-width: 260px;
            min-width: 220px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            padding: 14px;
            box-shadow: var(--shadow-md);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--muted-color);
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .entry-content-italic {
            font-style: italic;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
            color: var(--text-color);
        }

        .meta-info {
            font-size: 0.65rem;
            color: var(--muted-color);
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        .weekly-select-wrapper {
            margin-bottom: 8px;
            width: 100%;
        }

        .weekly-dropdown {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        .weekly-entry-item {
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .weekly-entry-item:last-child {
            border-bottom: none;
        }

        .weekly-date {
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 2px;
            color: var(--accent-color);
        }

        .weekly-text {
            font-size: 0.8rem;
            line-height: 1.35;
            white-space: pre-wrap;
        }

        .btn-action-sm {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.65rem;
        }

        .auth-input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--text-color);
            color: var(--bg-color);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            opacity: 0;
            transition: all 0.2s ease;
            z-index: 20000;
        }

        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                height: 100dvh;
                overflow: hidden !important;
            }

            .app-container {
                max-width: 100%;
                height: 100dvh;
                min-height: unset;
            }

            .top-controls {
                max-width: 75%;
                top: calc(50% - 155px);
            }

            .editor-card {
                max-width: 75% !important;
                height: 250px !important;
            }

            .calendar-card {
                top: calc(50% + 31vh) !important;
            }

            .btn-top-logout {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <button class="btn-top-logout" onclick="handleAuthAction()" id="authButtonIcon" title="logout / login">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <div class="top-controls" id="topControls">
        <div class="top-left-controls">
            <div class="theme-switch" onclick="toggleTheme()" title="toggle theme">
                <div class="theme-switch-handle" id="switchHandle">
                    <svg viewBox="0 0 24 24" id="switchIcon"></svg>
                </div>
            </div>
        </div>
        <button class="weekly-audit-dot" onclick="openWeeklyAudit()" title="weekly audit"></button>
    </div>

    <main class="editor-card" id="editorCard">
        <div 
            class="journal-textarea" 
            id="mainTextarea" 
            contenteditable="true"
            data-placeholder="what is on your mind today? write freely..."
            oninput="handleEditorInput('mainTextarea', 'counterDisplay')"
            onkeydown="handleEditorKeydown(event, 'mainTextarea', 'counterDisplay')"
        ></div>

        <div class="floating-footer-left" id="counterDisplay">0 words · 0 chars</div>
        <div class="floating-footer-right">
            <button class="btn-clear-inline" onclick="clearJournal('mainTextarea', 'counterDisplay')" title="clear text">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <button class="btn-circle-submit" onclick="saveCurrentJournal()" title="submit / update"></button>
        </div>
    </main>

    <div class="calendar-card" id="calendarCard">
        <div class="calendar-header">
            <div class="calendar-nav-group">
                <button class="cal-icon-btn" onclick="jumpToday()" title="today">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
            <span class="month-display" id="monthYearTitle"></span>
            <div class="calendar-nav-group">
                <button class="cal-icon-btn" onclick="prevMonth()" title="previous month">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <button class="cal-icon-btn" onclick="nextMonth()" title="next month">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>
        </div>

        <div class="weekdays-grid">
            <span>s</span><span>m</span><span>t</span><span>w</span><span>t</span><span>f</span><span>s</span>
        </div>
        <div class="days-grid" id="calendarDays"></div>
    </div>
</div>

<div class="modal-overlay" id="loginModal">
    <div class="modal-card" style="max-width: 280px;">
        <div class="modal-header">
            <span class="modal-title">supabase login</span>
        </div>
        <div class="modal-body" style="gap: 10px; padding-top: 4px;">
            <input type="email" id="loginEmail" class="auth-input" placeholder="email address...">
            <input type="password" id="loginPassword" class="auth-input" placeholder="password...">
            <button class="btn-action-sm" style="width: 100%; padding: 7px; margin-top: 4px;" onclick="submitLogin()">sign in</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="readModal" onclick="closeModalOnOverlay(event, 'readModal')">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title" id="readModalDate"></span>
            <button class="btn-close" onclick="closeModal('readModal')">×</button>
        </div>
        <div class="modal-body">
            <div class="entry-content-italic" id="readModalContent"></div>
            <div class="meta-info" id="readModalMeta"></div>
        </div>
        <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
            <button class="btn-action-sm" id="readModalEditBtn">edit entry</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal" onclick="closeModalOnOverlay(event, 'editModal')">
    <div class="modal-card" style="max-width: 320px; width: 85vw; padding: 0; overflow: hidden; background: var(--card-bg);">
        <div class="modal-header" style="padding: 12px 16px; margin-bottom: 0; border-bottom: 1px solid var(--border-color);">
            <span class="modal-title" id="editModalDate">edit entry</span>
            <button class="btn-close" onclick="closeModal('editModal')">×</button>
        </div>
        <div class="modal-body" style="padding: 16px; position: relative; height: 180px; overflow: hidden; display: flex; flex-direction: column;">
            <div 
                class="journal-textarea" 
                id="editModalTextarea" 
                contenteditable="true"
                data-placeholder="what is on your mind for this date? write freely..."
                oninput="handleEditorInput('editModalTextarea', 'editCounterDisplay')"
                onkeydown="handleEditorKeydown(event, 'editModalTextarea', 'editCounterDisplay')"
                style="text-align: center; font-size: 1.05rem; height: 100%;"
            ></div>
            
            <div style="content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 45px; background: linear-gradient(to top, var(--card-bg), transparent); pointer-events: none;"></div>

            <div class="floating-footer-left" id="editCounterDisplay" style="bottom: 14px; left: 16px;">0 words · 0 chars</div>

            <div class="floating-footer-right" style="bottom: 12px; right: 14px; gap: 8px;">
                <button class="btn-clear-inline" onclick="clearJournal('editModalTextarea', 'editCounterDisplay')" title="clear text">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button class="btn-circle-submit" onclick="saveModalEdit()" title="submit"></button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="weeklyModal" onclick="closeModalOnOverlay(event, 'weeklyModal')">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title">weekly audit</span>
            <button class="btn-close" onclick="closeModal('weeklyModal')">×</button>
        </div>
        <div class="weekly-select-wrapper">
            <select class="weekly-dropdown" id="weeklyWeekSelector" onchange="renderWeeklyAuditContent()"></select>
        </div>
        <div class="modal-body" id="weeklyModalBody"></div>
        <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
            <button class="btn-action-sm" onclick="copyWeeklyAudit()">copy summary</button>
        </div>
    </div>
</div>

<script>

    window.addEventListener('DOMContentLoaded', async () => {

    async function autoDeleteOldEntries() {

    async function handleAuthAction() {
        if (currentUser) {

    async function fetchUserEntries() {
        if (!currentUser) return;

            .from('journals')
            .select('*')
            .eq('user_id', currentUser.id);

    }

    function getFormattedDateStr(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');

    function initTheme() {
        const isDark = (localStorage.getItem('journal_theme') || 'day') === 'dark';
        document.body.classList.toggle('dark-mode', isDark);
        $('switchIcon').innerHTML = isDark ? moonIconSVG : sunIconSVG;
        $('theme-color-meta').setAttribute('content', isDark ? '#141413' : '#f4f1ea');
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('journal_theme', isDark ? 'dark' : 'day');
        $('switchIcon').innerHTML = isDark ? moonIconSVG : sunIconSVG;
        $('theme-color-meta').setAttribute('content', isDark ? '#141413' : '#f4f1ea');

    function initKeyboardShortcuts() {
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                ['readModal', 'editModal', 'weeklyModal'].forEach(closeModal);
            }
        });

    }

    function initEditorFocusEvents() {
        const textarea = $('mainTextarea');
        const toggleDim = add => {
            $('calendarCard').classList.toggle('dimmed', add);
            $('topControls').classList.toggle('dimmed', add);
        };
        textarea.addEventListener('focus', () => toggleDim(true));
        textarea.addEventListener('blur', () => toggleDim(false));
    }

    function loadTodayOrDraft() {
        const todayStr = getFormattedDateStr(new Date());
        selectedDateStr = todayStr;
        safeSetEditorContent('mainTextarea', journalEntries[todayStr] ? journalEntries[todayStr].content : '');
        updateEditorCounter('mainTextarea', 'counterDisplay');
    }

    // ===== editor core (single source, shared by mainTextarea & editModalTextarea) =====

    function updateCounters(text, targetId) {
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        $(targetId).innerText = `${words} words · ${chars} chars`;
    }

    // walks editor DOM into plain text. marked=true keeps struck segments as ~~text~~
    // (for plain-text exports); marked=false drops struck segments entirely (active text).
    function extractText(root, marked) {
        let text = '';
        root.childNodes.forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) text += node.textContent;
            else if (node.nodeType === Node.ELEMENT_NODE) {
                if (node.tagName === 'BR') text += '\n';
                else if (node.tagName === 'S') { if (marked) text += `~~${node.textContent}~~`; }
                else text += node.textContent;
            }
        });
        return text;
    }

    function htmlToText(html, marked) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html || '';
        return extractText(tmp, marked);
    }

    function updateEditorCounter(editorId, counterId) {
        updateCounters(extractText($(editorId), false), counterId);
    }

    function handleEditorInput(editorId, counterId) {
        normalizeEditor($(editorId));
        updateEditorCounter(editorId, counterId);
    }

    function clearJournal(editorId, counterId) {
        $(editorId).innerHTML = '';
        updateCounters('', counterId);
        showToast('text cleared');
    }

    // legacy plain-text entries (pre-strikethrough feature) may contain literal '<'/'>'
    // characters, so only trust markup we recognize; escape everything else. Shared by
    // the editors and the read-only displays (read modal, weekly audit) — single source.
    function safeContentHTML(raw) {
        if (!raw) return '';
        const hasKnownTags = /<\/?(s|br)\b/i.test(raw);
        const hasAnyTag = /</.test(raw);
        if (hasAnyTag && !hasKnownTags) {
            const div = document.createElement('div');
            div.textContent = raw;
            return div.innerHTML;
        }
        return raw;
    }

    function safeSetEditorContent(editorId, raw) {
        $(editorId).innerHTML = safeContentHTML(raw);
    }

    function lowercaseHTML(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT);
        let n;
        while (n = walker.nextNode()) n.textContent = n.textContent.toLowerCase();
        return tmp.innerHTML;
    }

    function getEditorSaveContent(editorId) {
        const el = $(editorId);
        normalizeEditor(el);
        const activeText = extractText(el, false).trim();
        if (!activeText) return { html: '', isEmpty: true };
        return { html: lowercaseHTML(el.innerHTML), isEmpty: false };
    }

    // merges adjacent <s> siblings so repeated backspacing doesn't leave a pile of tiny tags
    function normalizeEditor(root) {
        root.normalize();
        let node = root.firstChild;
        while (node) {
            const next = node.nextSibling;
            if (node.nodeType === 1 && node.tagName === 'S' && next && next.nodeType === 1 && next.tagName === 'S') {
                node.appendChild(document.createTextNode(next.textContent));
                next.remove();
                continue;
            }
            node = next;
        }
    }

    function placeCaret(node, atStart) {
        const range = document.createRange();
        const sel = window.getSelection();
        if (node.nodeType === Node.TEXT_NODE) {
            range.setStart(node, atStart ? 0 : node.textContent.length);
        } else {
            const parent = node.parentNode;
            const idx = Array.prototype.indexOf.call(parent.childNodes, node);
            range.setStart(parent, atStart ? idx : idx + 1);
        }
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function strikeRange(range) {
        const s = document.createElement('s');
        try {
            range.surroundContents(s);
        } catch (e) {
            const frag = range.extractContents();
            s.appendChild(frag);
            range.insertNode(s);
        }
        placeCaret(s, false);
    }

    function insertLineBreak(editorEl) {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        placeCaret(br, false);
    }

    // backspace/delete no longer remove text — they strike it through instead.
    // characters already struck are skipped over (can't be re-struck / removed again).
    // 'backward' and 'forward' share identical logic mirrored by the `back` flag.
    function strikeOneUnit(editorEl, direction) {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);

        if (!range.collapsed) {
            strikeRange(range);
            normalizeEditor(editorEl);
            return;
        }

        const back = direction === 'backward';
        const container = range.startContainer;
        const offset = range.startOffset;

        if (container.nodeType === Node.TEXT_NODE) {
            const strikeParent = container.parentElement && container.parentElement.closest('s');
            if (strikeParent) { placeCaret(strikeParent, back); return; }

            const inBounds = back ? offset > 0 : offset < container.textContent.length;
            if (inBounds) {
                const text = container.textContent;
                const ch = back ? text[offset - 1] : text[offset];
                container.textContent = back
                    ? text.slice(0, offset - 1) + text.slice(offset)
                    : text.slice(0, offset) + text.slice(offset + 1);
                const s = document.createElement('s');
                s.textContent = ch;
                container.parentNode.insertBefore(s, container.nextSibling);
                normalizeEditor(editorEl);
                placeCaret(s, !back);
                return;
            }
        }

        const neighbor = container.nodeType === Node.TEXT_NODE
            ? (back ? container.previousSibling : container.nextSibling)
            : container.childNodes[back ? offset - 1 : offset];
        if (!neighbor) return;

        if (neighbor.nodeType === 1 && neighbor.tagName === 'S') { placeCaret(neighbor, back); return; }

        if (neighbor.nodeType === 1 && neighbor.tagName === 'BR') {
            const s = document.createElement('s');
            neighbor.parentNode.insertBefore(s, neighbor);
            s.appendChild(neighbor);
            placeCaret(s, !back);
            return;
        }

        if (neighbor.nodeType === Node.TEXT_NODE && neighbor.textContent.length) {
            const text = neighbor.textContent;
            const ch = back ? text.slice(-1) : text[0];
            neighbor.textContent = back ? text.slice(0, -1) : text.slice(1);
            const s = document.createElement('s');
            s.textContent = ch;
            neighbor.parentNode.insertBefore(s, back ? neighbor.nextSibling : neighbor);
            normalizeEditor(editorEl);
            placeCaret(s, !back);
        }
    }

    function handleEditorKeydown(e, editorId, counterId) {
        const editorEl = $(editorId);
        if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            strikeOneUnit(editorEl, e.key === 'Backspace' ? 'backward' : 'forward');
            updateEditorCounter(editorId, counterId);
            return;
        }
        if (e.key === 'Enter') {
            if (editorId === 'editModalTextarea' && !e.shiftKey) {
                e.preventDefault();
                closeModal('editModal');
                showToast('exited edit mode');
                return;
            }
            e.preventDefault();
            insertLineBreak(editorEl);
            updateEditorCounter(editorId, counterId);
        }
    }

    // ===== save / load =====

    async function saveEntryToSupabase(dateStr, content) {
        if (!currentUser) { openModal('loginModal'); return false; }
        
        if (content) {
            const { error } = await supabaseClient
                .from('journals')
                .upsert({
                    user_id: currentUser.id,
                    entry_date: dateStr,
                    content: content,
                    updated_at: new Date().toISOString()
                }, { onConflict: ['user_id', 'entry_date'] });
            if (error) { showToast('save failed'); console.error(error); return false; }
        } else {
            await supabaseClient.from('journals').delete().eq('user_id', currentUser.id).eq('entry_date', dateStr);
        }

        await fetchUserEntries();
        return true;
    }

    async function saveCurrentJournal() {
        const { html, isEmpty } = getEditorSaveContent('mainTextarea');
        if (isEmpty) return showToast('entry is empty');

        const success = await saveEntryToSupabase(getFormattedDateStr(new Date()), html);
        if (success) showToast('journal saved & updated!');
    }

    async function saveModalEdit() {
        if (!activeEditModalDate || !currentUser) return;
        const { html, isEmpty } = getEditorSaveContent('editModalTextarea');

        const success = await saveEntryToSupabase(activeEditModalDate, isEmpty ? '' : html);
        if (success) {
            if (activeEditModalDate === getFormattedDateStr(new Date())) loadTodayOrDraft();
            closeModal('editModal');
            showToast('entry updated online!');
        }
    }

    function renderCalendar() {
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();

        const monthNames3 = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
        $('monthYearTitle').innerText = `${monthNames3[m]} '${String(y).slice(-2)}`;

        const firstDayIndex = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const daysContainer = $('calendarDays');
        daysContainer.innerHTML = '';

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            daysContainer.appendChild(emptyCell);
        }

        const realTodayStr = getFormattedDateStr(new Date());

        for (let day = 1; day <= totalDays; day++) {
            const formattedM = String(m + 1).padStart(2, '0');
            const formattedD = String(day).padStart(2, '0');
            const dateStr = `${y}-${formattedM}-${formattedD}`;

            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            dayCell.innerText = day;

            const indicator = document.createElement('div');
            indicator.className = 'day-indicator';
            dayCell.appendChild(indicator);

            if (dateStr === realTodayStr) dayCell.classList.add('today-cell');
            if (journalEntries[dateStr]) dayCell.classList.add('has-entry');

            dayCell.onclick = () => handleDateClick(dateStr);
            daysContainer.appendChild(dayCell);
        }
    }

    function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
    function jumpToday() { currentDate = new Date(); renderCalendar(); }

    function handleDateClick(dateStr) {
        const entry = journalEntries[dateStr];
        const dateObj = new Date(dateStr + 'T00:00:00');
        $('readModalDate').innerText = fmtDate(dateObj, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        if (entry && entry.content) {
            $('readModalContent').innerHTML = `"${safeContentHTML(entry.content)}"`;
            const activeText = htmlToText(entry.content, false).trim();
            $('readModalMeta').innerHTML = `
                <span>words: ${activeText ? activeText.split(/\s+/).length : 0} · chars: ${activeText.length}</span>
                <span>created: ${fmtDateTime(entry.createdAt)}</span>
                <span>modified: ${fmtDateTime(entry.updatedAt)}</span>
            `;
        } else {
            $('readModalContent').innerText = "you haven't written anything for this date.";
            $('readModalMeta').innerHTML = "<span>no metadata available</span>";
        }

        $('readModalEditBtn').onclick = () => { closeModal('readModal'); openEditModal(dateStr); };
        openModal('readModal');
    }

    function openEditModal(dateStr) {
        activeEditModalDate = dateStr;
        const dateObj = new Date(dateStr + 'T00:00:00');
        $('editModalDate').innerText = `edit: ${fmtDate(dateObj, { weekday: 'long', month: 'short', day: 'numeric' })}`;
        
        const existingContent = journalEntries[dateStr] ? journalEntries[dateStr].content : '';
        safeSetEditorContent('editModalTextarea', existingContent);
        updateEditorCounter('editModalTextarea', 'editCounterDisplay');

        openModal('editModal');
    }

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        return { year: d.getUTCFullYear(), week: Math.ceil((((d - yearStart) / 86400000) + 1)/7) };
    }

    function getDateRangeOfWeek(weekNo, year) {
        const simple = new Date(year, 0, 1 + (weekNo - 1) * 7);
        const dow = simple.getDay();
        const ISOweekStart = new Date(simple);
        dow <= 4 ? ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1) : ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
        
        return Array.from({length: 7}, (_, i) => {
            const nextDay = new Date(ISOweekStart);
            nextDay.setDate(ISOweekStart.getDate() + i);
            return nextDay;
        });
    }

    function openWeeklyAudit() {
        const selector = $('weeklyWeekSelector');
        selector.innerHTML = '';
        const currentW = getWeekNumber(new Date());

        for (let w = currentW.week; w >= 1; w--) {
            const dates = getDateRangeOfWeek(w, currentW.year);
            const startStr = fmtDate(dates[0], { month: 'short', day: 'numeric' });
            const endStr = fmtDate(dates[6], { month: 'short', day: 'numeric' });
            
            const opt = document.createElement('option');
            opt.value = `${currentW.year}-W${w}`;
            opt.innerText = `week ${w} (${startStr} - ${endStr})`;
            selector.appendChild(opt);
        }

        selector.selectedIndex = 0;
        renderWeeklyAuditContent();
        openModal('weeklyModal');
    }

    function renderWeeklyAuditContent() {
        const val = $('weeklyWeekSelector').value;
        if (!val) return;

        const [yearStr, weekPart] = val.split('-W');
        const dates = getDateRangeOfWeek(parseInt(weekPart, 10), parseInt(yearStr, 10));
        const bodyEl = $('weeklyModalBody');
        bodyEl.innerHTML = '';

        dates.forEach(d => {
            const dateStr = getFormattedDateStr(d);
            const formattedDate = fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' });
            const entry = journalEntries[dateStr];
            const itemEl = document.createElement('div');
            itemEl.className = 'weekly-entry-item';

            itemEl.innerHTML = entry && entry.content 
                ? `<div class="weekly-date">${formattedDate}</div><div class="weekly-text">${safeContentHTML(entry.content)}</div>`
                : `<div class="weekly-date">${formattedDate}</div><div class="weekly-text" style="color: var(--muted-color); font-style: italic;">no entry recorded.</div>`;

            bodyEl.appendChild(itemEl);
        });
    }

    function copyWeeklyAudit() {
        const val = $('weeklyWeekSelector').value;
        if (!val) return;

        const [yearStr, weekPart] = val.split('-W');
        const weekNum = parseInt(weekPart, 10);
        const yearNum = parseInt(yearStr, 10);
        const dates = getDateRangeOfWeek(weekNum, yearNum);

        let summaryText = `weekly audit summary - week ${weekNum} (${yearNum})\n\n`;

        dates.forEach(d => {
            const formattedDate = fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' });
            const entry = journalEntries[getFormattedDateStr(d)];
            summaryText += `--- ${formattedDate} ---\n${entry ? htmlToText(entry.content, true) : '(no entry)'}\n\n`;
        });

        navigator.clipboard.writeText(summaryText.trim()).then(() => showToast('summary copied to clipboard!'));
    }

    function openModal(id) {
        const modal = $(id);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), MODAL_OPEN_DELAY_MS);
    }

    function closeModal(id) {
        const modal = $(id);
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', MODAL_CLOSE_DELAY_MS);
    }

    function closeModalOnOverlay(event, id) {
        if (event.target.id === id) closeModal(id);
    }

    function showToast(msg) {
        const toast = $('toast');
        toast.innerText = msg.toLowerCase();
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), TOAST_DURATION_MS);
    }
</script>
